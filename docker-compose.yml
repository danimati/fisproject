services:
  db:
    image: postgres:15-alpine
    container_name: maritime_db
    environment:
      POSTGRES_DB: maritime_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maritime_network

  redis:
    image: redis:7-alpine
    container_name: maritime_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maritime_network

  api:
    build: ./marine-api
    command: ["uvicorn", "--app-dir", "/app", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - DATABASE_URL=postgresql://felatiko:b9HFSg5M3CCN8nX3sBAoozJMt3Y9LCvS@dpg-d89ln8i8qa3s73e59v20-a.oregon-postgres.render.com/buquesproject
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=true
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - maritime_network
    restart: unless-stopped

  gateway:
    build: ./gateway
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/maritime_db
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_URL=http://api:8000
      - DEBUG=true
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
    deploy:
      replicas: 5
    depends_on:
      - redis
      - api
      - db
    networks:
      - maritime_network
    restart: unless-stopped

  front:
    build: 
      context: ./Front/adminConfigurations
      args:
        - API_URL=http://mateo.proyecto.com/back
    container_name: maritime_front
    depends_on:
      - gateway
      - api
    networks:
      - maritime_network
    restart: unless-stopped

  nginx:
    build: ./nginx
    container_name: maritime_nginx
    ports:
      - "80:80"
    volumes:
      - front_dist:/usr/share/nginx/html/front
    depends_on:
      - api
      - gateway
      - front
    networks:
      - maritime_network
    restart: unless-stopped


volumes:
  postgres_data:
  redis_data:
  front_dist:


networks:
  maritime_network:
    driver: bridge
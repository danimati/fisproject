services:
  db:
    image: postgres:15-alpine
    container_name: maritime_db
    environment:
      POSTGRES_DB: maritime_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maritime_network

  redis:
    image: redis:7-alpine
    container_name: maritime_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maritime_network

  api:
    build: ./marine-api
    command: ["uvicorn", "--app-dir", "/app", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/maritime_db
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=true
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - maritime_network
    restart: unless-stopped

  gateway:
    build: ./gateway
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/maritime_db
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_URL=http://api:8000
      - DEBUG=true
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
    deploy:
      replicas: 15
    depends_on:
      - db
      - redis
      - api
    networks:
      - maritime_network
    restart: unless-stopped

  nginx:
    build: ./nginx
    container_name: maritime_nginx
    ports:
      - "80:80"
    depends_on:
      - api
      - gateway
    networks:
      - maritime_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  maritime_network:
    driver: bridge